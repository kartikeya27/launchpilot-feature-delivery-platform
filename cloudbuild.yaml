substitutions:
  _IMAGE: us-central1-docker.pkg.dev/placeholder/launchpilot/api:v2
  _OIDC_ISSUER: https://issuer.example.com
  _OIDC_CLIENT_ID: launchpilot-web
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - VITE_AUTH_MODE=oidc
      - --build-arg
      - VITE_OIDC_AUTHORITY=${_OIDC_ISSUER}
      - --build-arg
      - VITE_OIDC_CLIENT_ID=${_OIDC_CLIENT_ID}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
