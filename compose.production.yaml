# LOCAL production-style reference stack, not Internet-hardened production.
# Usage: docker compose -f compose.production.yaml up --build -d
x-api-env: &api-env
  APP_ENV: production
  AUTH_MODE: oidc
  AUTO_CREATE_SCHEMA: "false"
  SEED_DEMO: "true"
  DATABASE_URL: postgresql+psycopg://launchpilot:local-only-db-pass@postgres:5432/launchpilot
  REDIS_URL: redis://redis:6379/0
  EVENT_TRANSPORT: kafka
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC: launchpilot.events.v1
  OIDC_ISSUER: http://localhost:8081/realms/launchpilot
  OIDC_AUDIENCE: launchpilot-api
  OIDC_JWKS_URL: http://keycloak:8080/realms/launchpilot/protocol/openid-connect/certs
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  METRICS_TOKEN: local-prometheus-only
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: launchpilot
      POSTGRES_USER: launchpilot
      POSTGRES_PASSWORD: local-only-db-pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchpilot -d launchpilot"]
      interval: 5s
      retries: 15
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes: [kafka_data:/var/lib/kafka/data]
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: localadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-only-keycloak-pass
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_ENABLED: "true"
    ports: ["127.0.0.1:8081:8080"]
    volumes: ["./infra/keycloak/launchpilot-realm.json:/opt/keycloak/data/import/launchpilot-realm.json:ro"]
  migrate:
    build:
      context: .
      args:
        VITE_AUTH_MODE: oidc
        VITE_OIDC_AUTHORITY: http://localhost:8081/realms/launchpilot
        VITE_OIDC_CLIENT_ID: launchpilot-web
    environment: *api-env
    command: ["sh", "-c", "cd backend && alembic upgrade head"]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build:
      context: .
      args:
        VITE_AUTH_MODE: oidc
        VITE_OIDC_AUTHORITY: http://localhost:8081/realms/launchpilot
        VITE_OIDC_CLIENT_ID: launchpilot-web
    environment: *api-env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      keycloak: {condition: service_started}
      kafka: {condition: service_started}
    restart: unless-stopped
  publisher:
    build: .
    environment: *api-env
    command: ["python", "-m", "backend.app.worker", "publish"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      kafka: {condition: service_started}
    restart: unless-stopped
  consumer:
    build: .
    environment: *api-env
    command: ["python", "-m", "backend.app.worker", "consume"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      kafka: {condition: service_started}
    restart: unless-stopped
  # Polls opt-in SLO policies. All policies start disabled.
  guardrail:
    build: .
    environment:
      <<: *api-env
      GUARDRAIL_WORKER_ENABLED: "true"
      GUARDRAIL_POLL_SECONDS: "15"
    command: ["python", "-m", "backend.app.guardrails"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./infra/otel/collector.yaml:/etc/otelcol/config.yaml:ro"]
    depends_on: [jaeger]
  jaeger:
    image: jaegertracing/jaeger:2.3.0
    ports: ["127.0.0.1:16686:16686"]
  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [api]
  grafana:
    image: grafana/grafana:11.5.1
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: local-only-grafana-pass
    volumes: ["./infra/grafana/provisioning:/etc/grafana/provisioning:ro"]
    depends_on: [prometheus]
volumes:
  postgres_data:
  redis_data:
  kafka_data:
