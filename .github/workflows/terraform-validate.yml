name: Terraform blueprint validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['infra/terraform/**', '.github/workflows/terraform-validate.yml']
  pull_request:
    paths: ['infra/terraform/**', '.github/workflows/terraform-validate.yml']
permissions:
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/terraform/gcp
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - name: Display formatting differences (nonblocking until blueprint is normalized)
        run: terraform fmt -diff -check -recursive || true
      - name: Initialize providers without backend or cloud credentials
        run: terraform init -backend=false -input=false
      - name: Terraform schema and cross-reference validation
        run: terraform validate -no-color
      - name: Confirm deployment is not automatic
        run: echo "Static Terraform checks only. No terraform apply and no live GCP deployment occurred."
