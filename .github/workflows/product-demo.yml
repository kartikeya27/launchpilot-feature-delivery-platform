name: Product demo - browser recording

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'README.md'
      - 'compose.production.yaml'
      - 'infra/keycloak/**'
      - 'scripts/setup_local_credentials.py'
      - 'frontend/demo-credentials.ts'
      - 'docs/**'
      - 'frontend/demo/**'
      - 'frontend/playwright.demo.config.ts'
      - '.github/workflows/product-demo.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'compose.production.yaml'
      - 'infra/keycloak/**'
      - 'scripts/setup_local_credentials.py'
      - 'frontend/demo-credentials.ts'
      - 'docs/**'
      - 'frontend/demo/**'
      - 'frontend/playwright.demo.config.ts'
      - '.github/workflows/product-demo.yml'

permissions:
  contents: read

jobs:
  record-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate disposable credentials for Compose and Playwright
        run: python3 scripts/setup_local_credentials.py --ci
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start disposable Keycloak, PostgreSQL, Redis, Kafka, API and workers
        run: docker compose -f compose.production.yaml up -d --build api publisher consumer guardrail otel-collector
      - name: Wait for authenticated application to become ready
        shell: bash
        run: |
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8000/api/health/ready >/dev/null && \
               curl -fsS http://localhost:8081/realms/launchpilot/.well-known/openid-configuration >/dev/null; then
              echo "Full local integration stack ready"
              exit 0
            fi
            sleep 3
          done
          docker compose -f compose.production.yaml logs --tail=100 api keycloak migrate
          exit 1
      - name: Install Playwright browser
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Record synthetic staging checkout demonstration
        working-directory: frontend
        env:
          CI: 'true'
        run: npx playwright test --config=playwright.demo.config.ts
      - name: Copy recording with a friendly file name
        if: always()
        shell: bash
        run: |
          mkdir -p demo-output
          VIDEO=$(find frontend/test-results -type f -name 'video.webm' -print -quit || true)
          if [[ -n "$VIDEO" ]]; then
            cp "$VIDEO" demo-output/launchpilot-product-demo.webm
          else
            echo "No Playwright video found; investigate browser test failure."
            exit 1
          fi
      - name: Upload short browser recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launchpilot-demo-video
          path: demo-output/launchpilot-product-demo.webm
          if-no-files-found: error
          retention-days: 7
      - name: Upload HTML report, screenshots and trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-demo-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Diagnose startup or browser failure
        if: failure()
        run: docker compose -f compose.production.yaml logs --tail=120 api keycloak publisher consumer
      - name: Clean up disposable CI stack
        if: always()
        run: docker compose -f compose.production.yaml down -v --remove-orphans
