name: Security scans
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 7 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Bandit AST scan
        run: bandit -r backend/app -ll -x backend/tests
      - name: Dependency advisory scan
        run: pip-audit -r backend/requirements.txt
  node-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm audit --audit-level=high
  codeql:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t launchpilot:scan .
      # Report every HIGH/CRITICAL issue, including unpatched OS advisories.
      - name: Trivy full vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: launchpilot:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'
      # Keep the gate strict for vulnerabilities with available fixes.
      # Unfixed advisories are still visible in the preceding full report.
      - name: Block fixable HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: launchpilot:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
