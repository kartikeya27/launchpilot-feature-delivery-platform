name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Python lint
        run: ruff check app tests integration
      - name: API, OIDC, Redis, experiment and outbox unit tests
        run: PYTHONPATH=. pytest -q tests
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: launchpilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d launchpilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Run Alembic migration and real Postgres integration checks
        env:
          INTEGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/launchpilot_test
        run: PYTHONPATH=. pytest -q integration
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r ../backend/requirements-dev.txt
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
          VITE_AUTH_MODE: demo
      # Capture the HTML report, screenshots, video, and traces even on success.
      # CI uses only synthetic/demo identities: artifacts on public repositories can be viewed by readers.
      - name: Upload Playwright browser evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-browser-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7
