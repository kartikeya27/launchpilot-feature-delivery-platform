[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# conftest sets DATABASE_URL before importing the app and its SQLAlchemy engine.
[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
